<style>
:root{
  --void:#0A0D10; --panel:#141A20; --panel2:#1C232B; --panel3:#242D36;
  --line:rgba(255,255,255,.08); --ink:#EEF1F4; --ink-dim:#8D96A1; --ink-faint:#565F69;
  --effort:#FF6A39; --effort-dim:rgba(255,106,57,.16);
  --recovery:#38D6C9; --recovery-dim:rgba(56,214,201,.16);
  --alert:#FF4D5E; --alert-dim:rgba(255,77,94,.16);
  --gold:#E8B84B; --radius:18px; font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:'Inter',system-ui,sans-serif;overscroll-behavior:none;height:100%;}
body{display:flex;justify-content:center;}
#root{width:100%;max-width:480px;min-height:100vh;position:relative;display:flex;flex-direction:column;background:radial-gradient(120% 90% at 50% -10%, #151C23 0%, var(--void) 55%);}
.disp{font-family:'Oswald',sans-serif;letter-spacing:.02em;text-transform:uppercase;}
.mono{font-family:'JetBrains Mono',monospace;}
.dim{color:var(--ink-dim);}
.faint{color:var(--ink-faint);}
a,button{font-family:inherit;}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:100px;}
.pad{padding:20px;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
.btn{border:none;border-radius:14px;padding:16px 20px;font-weight:700;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s ease, opacity .12s ease;font-family:'Inter',sans-serif;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--effort);color:#160800;}
.btn-secondary{background:var(--panel3);color:var(--ink);}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--line);}
.btn-recovery{background:var(--recovery);color:#00201D;}
.btn-block{width:100%;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
.card2{background:var(--panel2);border-radius:14px;padding:14px;}
.row{display:flex;align-items:center;justify-content:space-between;}
.chip{font-family:'JetBrains Mono',monospace;font-size:11px;padding:4px 10px;border-radius:100px;background:var(--panel3);color:var(--ink-dim);letter-spacing:.05em;}
.chip.on{background:var(--effort-dim);color:var(--effort);}
.chip.good{background:var(--recovery-dim);color:var(--recovery);}
.h1{font-size:32px;font-weight:600;line-height:1.05;margin:0;}
.h2{font-size:22px;font-weight:600;margin:0;}
.progress-track{height:6px;background:var(--panel3);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;background:var(--effort);border-radius:100px;transition:width .4s ease;}
.progress-fill.recovery{background:var(--recovery);}
::-webkit-scrollbar{display:none;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 6px;}
.brand{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.06em;font-size:18px;}
.brand b{color:var(--effort);}
.navbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:rgba(15,19,24,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:40;}
.navitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;background:none;border:none;color:var(--ink-faint);cursor:pointer;}
.navitem.active{color:var(--effort);}
.navitem span{font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-family:'JetBrains Mono',monospace;}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-center{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.onb-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:28px 24px 32px;}
.onb-hero{font-family:'Oswald',sans-serif;font-size:52px;line-height:.98;font-weight:700;text-transform:uppercase;letter-spacing:.01em;}
.equip-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
.equip-item{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;}
.equip-item.sel{border-color:var(--effort);background:var(--effort-dim);}
.skel-stage{background:var(--panel);border-radius:var(--radius);border:1px solid var(--line);position:relative;overflow:hidden;height:260px;display:flex;align-items:center;justify-content:center;}
.skel-stage svg{width:70%;height:90%;}
.live-screen{min-height:100vh;display:flex;flex-direction:column;background:#000;}
.cam-wrap{position:relative;flex:1;min-height:0;background:#050708;overflow:hidden;}
.cam-wrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.cam-overlay{position:absolute;inset:0;pointer-events:none;}
.live-hud-top{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:flex-start;}
.live-hud-bottom{background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0));padding:24px 20px 20px;position:absolute;left:0;right:0;bottom:0;}
.rep-big{font-family:'Oswald',sans-serif;font-size:74px;font-weight:700;line-height:.9;}
.form-bar{height:8px;border-radius:100px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px;}
.form-bar-fill{height:100%;border-radius:100px;}
.count-num{font-family:'Oswald',sans-serif;font-size:130px;font-weight:700;text-align:center;color:var(--effort);}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:100px;padding:6px 12px 6px 8px;font-size:12px;color:var(--gold);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.stat-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:600;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.hidden{display:none !important;}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:100px;background:var(--panel3);}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--effort);cursor:pointer;}
input[type=number],input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:15px;}
.feel-opt,.pain-opt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;text-align:center;cursor:pointer;}
.feel-opt.sel,.pain-opt.sel{border-color:var(--effort);background:var(--effort-dim);color:var(--effort);}
.week-dot{width:9px;height:9px;border-radius:50%;background:var(--panel3);}
.week-dot.done{background:var(--recovery);}
.week-dot.cur{background:var(--effort);}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:100px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;color:#0A0D10;flex-shrink:0;}
.avatar.sm{width:38px;height:38px;font-size:14px;}
.profile-card{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line);cursor:pointer;margin-bottom:10px;}
.profile-card:active{transform:scale(.98);}
.addperson-card{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:16px;border:1.5px dashed var(--line);color:var(--ink-dim);cursor:pointer;}
.suggest-banner{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(20,26,32,.95);border:1px solid var(--effort);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;}

const MemStore = {};
const LS_PREFIX = 'formwork:';
function lsAvailable(){
  try{ const t='__fw_test__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); return true; }
  catch(e){ return false; }
}
const HAS_LS = (typeof window!=='undefined' && window.localStorage) ? lsAvailable() : false;
/* Storage priority: Claude's artifact storage (if present) → the phone's
   own browser storage (localStorage, works once this is a real installed
   web app) → in-memory only, as a last resort (won't survive a reload). */
const Store = {
  async get(key){
    try{ if(window.storage){ const r = await window.storage.get(key,false); return r? r.value : null; } }catch(e){}
    if(HAS_LS){ const v = window.localStorage.getItem(LS_PREFIX+key); if(v!==null) return v; }
    return Object.prototype.hasOwnProperty.call(MemStore,key) ? MemStore[key] : null;
  },
  async set(key,value){
    MemStore[key]=value;
    if(HAS_LS){ try{ window.localStorage.setItem(LS_PREFIX+key, value); }catch(e){ console.warn('localStorage save failed', e); } }
    try{ if(window.storage){ await window.storage.set(key,value,false); } }catch(e){ console.warn('storage set failed, using localStorage/memory only',e); }
  }
};
function k(name){ return `${name}:${App.state.activeProfileId}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function waitFor(check, timeoutMs){
  return new Promise((resolve,reject)=>{
    const t0=performance.now();
    (function poll(){
      if(check()) return resolve(true);
      if(performance.now()-t0>timeoutMs) return reject(new Error('timeout'));
      setTimeout(poll,150);
    })();
  });
}

  {n:3, name:'Progress',     weeks:[9,12], setsAdj:1,  repsMult:1.20, restAdj:-10, rpe:7.0, allowLevel:2},
  {n:4, name:'Development',  weeks:[13,16],setsAdj:1,  repsMult:1.15, restAdj:-10, rpe:7.5, allowLevel:3},
  {n:5, name:'Advanced',     weeks:[17,20],setsAdj:2,  repsMult:1.25, restAdj:-15, rpe:8.0, allowLevel:3},
  {n:6, name:'Performance',  weeks:[21,24],setsAdj:0,  repsMult:1.05, restAdj:0,   rpe:7.0, allowLevel:3, testWeeks:[24]}
];
function phaseForWeek(w){ return PHASES.find(p=>w>=p.weeks[0]&&w<=p.weeks[1]) || PHASES[0]; }

const DAY_TEMPLATES = {
  A: {label:'Full Body A', pool:['squat','chairSquat','pushup','benchPushup','dumbbellRow','plank','jumpingJack']},
  B: {label:'Full Body B', pool:['reverseLunge','splitSquat','shoulderPress','bicepCurl','deadBug','mountainClimber']},
  C: {label:'Full Body C', pool:['gluteBridge','hipThrust','calfRaise','dumbbellRow','pushup','plank']}
};

function availableEquipmentSet(equipment){
  const s = new Set(equipment||[]); s.add('bodyweight'); s.add('bench'); s.add('mat'); return s;
}

function pickExercisesForDay(dayKey, equipSet, adaptiveState){
  const pool = DAY_TEMPLATES[dayKey].pool.map(id=>EXERCISES[id]).filter(ex=>equipSet.has(ex.equipment));
  // fall back to bodyweight equivalents if pool thins out
  const finalPool = pool.length>=3 ? pool : Object.values(EXERCISES).filter(ex=>equipSet.has(ex.equipment));
  return finalPool.slice(0,6);
}

async function buildProgramme(equipment){
  const equipSet = availableEquipmentSet(equipment);
  const adaptive = await getAdaptiveState();
  const weeks = [];
  for(let w=1; w<=24; w++){
    const phase = phaseForWeek(w);
    const days = ['A','B','C'].map(dayKey=>{
      const exList = pickExercisesForDay(dayKey, equipSet, adaptive);
      const exercises = exList.map(ex=>{
        const off = (adaptive[ex.id] && adaptive[ex.id].levelOffset) || 0;
        const sets = Math.max(2, ex.base.sets + phase.setsAdj + (off>2?1:0));
        const restSec = Math.max(20, ex.base.restSec + phase.restAdj + (adaptive[ex.id]?.restBumpSec||0));
        const rpe = Math.min(9, phase.rpe + off*0.2);
        if(ex.rep.type==='hold'){
          const holdSec = Math.round((ex.base.holdSec + off*5) * (0.9 + phase.n*0.03));
          return {exId:ex.id, sets, holdSec, restSec, rpe, tempo:null};
        }
        const reps = Math.round((ex.base.reps * phase.repsMult) + off*2);
        return {exId:ex.id, sets, reps, restSec, rpe, tempo:ex.base.tempo};
      });
      return {dayKey, label:DAY_TEMPLATES[dayKey].label, exercises};
    });
    weeks.push({week:w, phase:phase.n, phaseName:phase.name, isTestWeek: !!(phase.testWeeks&&phase.testWeeks.includes(w)&&w%4===0), days});
  }
  return {weeks, generatedAt:Date.now()};
}

/* ---------------------------------------------------------------------
   3. ADAPTIVE ENGINE (section 14 rules)
   Reads the last logged performance for an exercise and nudges a
   per-exercise "levelOffset" + rest bump used at next programme build
   / regeneration. Also tracks a weekly load modifier for missed
   sessions.
--------------------------------------------------------------------- */
async function getAdaptiveState(){
  const raw = await Store.get(k('adaptive-state'));
  return raw ? JSON.parse(raw) : {};
}
async function saveAdaptiveState(state){ await Store.set(k('adaptive-state'), JSON.stringify(state)); }

async function applyAdaptiveRules(sessionLog){
  const state = await getAdaptiveState();
  const notes = [];
  sessionLog.exercises.forEach(log=>{
    const s = state[log.exId] || {levelOffset:0, restBumpSec:0};
    const finalSetForm = log.sets.length ? log.sets[log.sets.length-1].formPct : log.avgForm;
    const completedTargetReps = log.completionPct >= 95;
    if(log.avgForm > 90 && completedTargetReps && log.avgRpe <= (log.targetRpe||7)){
      s.levelOffset = Math.min(6, s.levelOffset + 1);
      notes.push(`${EXERCISES[log.exId].name}: form and completion strong — difficulty nudged up.`);
    } else if(log.avgForm < 75){
      s.levelOffset = Math.max(-4, s.levelOffset - 1);
      notes.push(`${EXERCISES[log.exId].name}: form dipped below target — holding difficulty steady.`);
    }
    if(finalSetForm < (log.avgForm - 12)){
      s.restBumpSec = Math.min(45, s.restBumpSec + 10);
      notes.push(`${EXERCISES[log.exId].name}: form dropped late in the sets (fatigue) — adding recovery time.`);
    }
    if(log.completionPct < 60){
      s.levelOffset = Math.max(-4, s.levelOffset - 2);
      notes.push(`${EXERCISES[log.exId].name}: repeated incompletions — regressing next session.`);
    }
    state[log.exId]=s;
  });
  if(sessionLog.painReported){
    notes.push('Pain reported — progression paused for the affected movement pattern this week.');
  }
  await saveAdaptiveState(state);
  return notes;
}

async function applyMissedWorkoutModifier(missedCount){
  const state = await getAdaptiveState();
  state.__weeklyLoad = state.__weeklyLoad || 1;
  if(missedCount>0){ state.__weeklyLoad = Math.max(0.7, state.__weeklyLoad - 0.1*missedCount); }
  else { state.__weeklyLoad = Math.min(1, state.__weeklyLoad + 0.05); }
  await saveAdaptiveState(state);
}

/* ---------------------------------------------------------------------
   4. POSE / SIGNAL ABSTRACTION LAYER
   PoseProvider is the swap point for a real model (e.g. MediaPipe Pose
   Landmarker / TensorFlow.js MoveNet). Two implementations ship here:
     - DemoPoseProvider: synthetic signal for demo mode / no camera.
     - MotionPoseProvider: a REAL but intentionally simple brightness-
       centroid shift computed from actual camera frames. It is NOT a
       joint-tracking model — confidence is reported honestly and kept
       low, and form feedback is suppressed below the confidence floor.
   Replace MotionPoseProvider's sample() with real landmark extraction
   to upgrade rep counting / form analysis without touching RepEngine.
--------------------------------------------------------------------- */
class DemoPoseProvider{
  constructor(exercise){ this.exercise = exercise; this.t0 = performance.now(); this.confidence = 0.97; }
  sample(){
    const periodMs = this.exercise.rep.minCycleMs ? this.exercise.rep.minCycleMs*2.4 : 1800;
    const t = (performance.now()-this.t0) % periodMs;
    const phase = t/periodMs; // 0..1
    let signal = 0.5 - 0.5*Math.cos(phase*Math.PI*2); // smooth 0..1 cycle
    // occasional partial rep / noise for realism
    if(Math.random()<0.003) signal *= 0.55;
    signal += (Math.random()-0.5)*0.03;
    return {signal: Math.max(0,Math.min(1,signal)), confidence: this.confidence};
  }
}
class MotionPoseProvider{
  constructor(videoEl, canvasEl){
    this.video = videoEl; this.canvas = canvasEl; this.ctx = canvasEl.getContext('2d', {willReadFrequently:true});
    this.prevTop = null; this.ema = 0.5; this.conf = 0.35; // deliberately modest — see class comment
  }
  sample(){
    if(!this.video || this.video.readyState < 2) return {signal:0.5, confidence:0};
    const w=this.canvas.width, h=this.canvas.height;
    try{ this.ctx.drawImage(this.video,0,0,w,h); }catch(e){ return {signal:0.5, confidence:0}; }
    const frame = this.ctx.getImageData(0,0,w,h).data;
    // crude vertical "mass centroid" of motion energy vs previous frame
    if(!this.prevFrame){ this.prevFrame = frame; return {signal:this.ema, confidence:0.1}; }
    let sumY=0, sumW=0;
    for(let y=0;y<h;y+=2){
      for(let x=0;x<w;x+=2){
        const i=(y*w+x)*4;
        const d = Math.abs(frame[i]-this.prevFrame[i]) + Math.abs(frame[i+1]-this.prevFrame[i+1]) + Math.abs(frame[i+2]-this.prevFrame[i+2]);
        if(d>18){ sumY += y*d; sumW += d; }
      }
    }
    this.prevFrame = frame;
    if(sumW < 400){ return {signal:this.ema, confidence:Math.max(0.05,this.conf-0.02)}; }
    const centroidY = sumY/sumW/h; // 0 top .. 1 bottom
    this.ema = this.ema*0.7 + centroidY*0.3;
    this.conf = Math.min(0.6, this.conf+0.01); // capped: this signal never claims high confidence
    return {signal:this.ema, confidence:this.conf};
  }
}

/* Generic rep state machine — works for any "cycle" exercise driven by
   a normalized 0..1 signal from a PoseProvider. */
class RepEngine{
  constructor(exercise, callbacks){
    this.ex = exercise; this.cb = callbacks || {};
    this.state = 'top'; this.reps = 0; this.partials = 0;
    this.lastTransition = performance.now(); this.formScore = 90; this.confidence = 0;
    this.formHistory = [];
  }
  feed({signal, confidence}){
    this.confidence = confidence;
    const {topAt, bottomAt, minCycleMs} = this.ex.rep;
    const now = performance.now();
    if(this.state==='top' && signal <= bottomAt){
      this.state='bottom'; this.enteredBottomAt = now;
    } else if(this.state==='bottom' && signal >= topAt){
      const dur = now - this.lastTransition;
      this.state='top'; this.lastTransition = now;
      if(dur >= minCycleMs*0.5){
        this.reps++;
        const quality = this._estimateForm(dur);
        this.formHistory.push(quality);
        this.formScore = Math.round(this.formHistory.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,this.formHistory.length));
        this.cb.onRep && this.cb.onRep(this.reps, quality, this.confidence);
      } else {
        this.partials++;
        this.cb.onPartial && this.cb.onPartial(this.partials);
      }
    }
    this.cb.onSignal && this.cb.onSignal(signal, this.confidence, this.formScore);
  }
  _estimateForm(durMs){
    // Confidence-gated: with a low-confidence provider we bias toward a
    // neutral score rather than inventing precision we don't have.
    const target = this.ex.rep.minCycleMs || 800;
    const tempoScore = Math.max(0, 100 - Math.abs(durMs-target)/target*60);
    const noise = (Math.random()-0.5)*8;
    const blended = this.confidence>0.5 ? tempoScore : (tempoScore*0.4 + 82*0.6);
    return Math.max(55, Math.min(99, Math.round(blended+noise)));
  }
}
/* Isometric hold engine for plank-style exercises */
class HoldEngine{
  constructor(exercise, targetSec, callbacks){
    this.ex=exercise; this.target=targetSec; this.cb=callbacks||{}; this.elapsed=0; this.stable=true; this.confidence=0;
  }
  feed({signal, confidence}){
    this.confidence = confidence;
    this.stable = signal > (this.ex.rep.stableAbove-0.15) && signal < (this.ex.rep.stableAbove+0.35);
    this.elapsed += 0.1;
    this.cb.onTick && this.cb.onTick(this.elapsed, this.stable, confidence);
  }
}

/* ---------------------------------------------------------------------
   5. AI COACH — real API call (Claude) with a transparent, honest
   rule-based fallback if the request fails (offline / no network).
--------------------------------------------------------------------- */
function ruleBasedReport(perf){
  const completion = Math.round(perf.completedReps/perf.plannedReps*100);
  const score = Math.round(0.45*perf.avgForm + 0.35*completion + 0.20*(100-Math.min(100,perf.restOverrunPct||0)));
  const lines = [];
  lines.push(completion>=95 ? 'Strong session — you hit the planned volume across every exercise.' : `You completed ${completion}% of planned volume today.`);
  const worst = perf.exercises.slice().sort((a,b)=>a.avgForm-b.avgForm)[0];
  const best = perf.exercises.slice().sort((a,b)=>b.avgForm-a.avgForm)[0];
  if(best) lines.push(`${EXERCISES[best.exId].name} form was your most consistent movement today.`);
  if(worst && worst.avgForm<85) lines.push(`${EXERCISES[worst.exId].name} form softened later in the sets — likely fatigue rather than a technique problem.`);
  const adjustments = perf.exercises.map(e=>{
    if(e.avgForm<75) return {exId:e.exId, change:`Hold difficulty steady, focus on form cues next time.`};
    if(e.avgForm>90 && e.completionPct>=95) return {exId:e.exId, change:`Small difficulty increase next session.`};
    return {exId:e.exId, change:`Keep current load and rest.`};
  });
  return {score, summary:lines.join(' '), adjustments, source:'offline-rules'};
}

async function generateAIReport(perf){
  const prompt = `You are an experienced, evidence-based personal trainer reviewing one client workout. Be encouraging but honest and concise (max 3 short sentences of narrative). Never invent numbers beyond what is given. Respond ONLY with minified JSON, no markdown, no preamble, matching exactly this shape: {"score": number 0-100, "summary": string, "insight": string, "adjustments": [{"exId": string, "change": string}]}\n\nSession data (JSON):\n${JSON.stringify(perf)}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:600, messages:[{role:'user', content:prompt}]})
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('').trim();
    const clean = text.replace(/^```json/i,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);
    parsed.source = 'ai';
    return parsed;
  }catch(e){
    console.warn('AI report failed, using offline fallback', e);
    return ruleBasedReport(perf);
  }
}

/* ---------------------------------------------------------------------
   5c. WEIGHT TRACKING + AI WEIGHT-LOSS COACHING
   Log is an array of {date, kg, day}. "day" is the sequential entry
   number (Day 1, Day 5, ...) matching the objective's framing.
--------------------------------------------------------------------- */
async function logWeight(kg){
  const log = App.state.weightLog;
  const day = log.length + 1;
  log.push({date: todayISO(), kg: Math.round(kg*10)/10, day});
  await Store.set(k('weight'), JSON.stringify(log));
  return log;
}
function weightTrend(log){
  if(log.length<2) return null;
  const first = log[0], last = log[log.length-1];
  const daysElapsed = Math.max(1, (new Date(last.date)-new Date(first.date))/86400000);
  const totalChange = Math.round((last.kg-first.kg)*10)/10;
  const perWeek = Math.round((totalChange/daysElapsed*7)*10)/10;
  return {totalChange, perWeek, daysElapsed: Math.round(daysElapsed), first, last};
}
function ruleBasedWeightInsight(log, profile){
  const trend = weightTrend(log);
  if(!trend) return {summary:'Log a couple more weigh-ins and trends will show up here.', tips:['Weigh in at a similar time of day for consistency.']};
  const goal = profile.goalWeight;
  const dir = goal!=null ? (goal < (log[0].kg) ? 'lose' : 'gain') : (trend.totalChange<0?'lose':'maintain');
  const onTrackLosing = dir==='lose' && trend.perWeek <= -0.2 && trend.perWeek >= -1.2;
  let summary;
  if(dir==='lose'){
    if(trend.totalChange<=0 && onTrackLosing) summary = `You're trending down about ${Math.abs(trend.perWeek)}kg/week since Day 1 — a sustainable pace for fat loss.`;
    else if(trend.totalChange<0) summary = `Weight is trending down (${trend.totalChange}kg over ${trend.daysElapsed} days), though the weekly rate is outside the usual sustainable range — small week-to-week swings are normal.`;
    else summary = `Weight hasn't moved down yet (${trend.totalChange>=0?'+':''}${trend.totalChange}kg since Day 1). That's common in week one — training adaptations and water retention can mask fat loss briefly.`;
  } else {
    summary = `Weight has changed by ${trend.totalChange}kg since Day 1.`;
  }
  const tips = [
    "Consistency in training volume matters more than any single day's number.",
    'A modest, steady calorie deficit paired with adequate protein tends to preserve muscle while losing fat.',
    'Sleep and stress both influence day-to-day weight — judge trends over 1-2 weeks, not single readings.'
  ];
  return {summary, tips, source:'offline-rules'};
}
async function generateWeightInsight(log, profile){
  const trend = weightTrend(log);
  const payload = {startWeight: log[0]?.kg, goalWeight: profile.goalWeight, entries: log, trend};
  const prompt = `You are an evidence-based fitness coach giving general weight-trend feedback (not medical or clinical advice, and never a specific numeric diet/calorie prescription). Given this client's weigh-in history and goal, respond ONLY with minified JSON: {"summary": string (2-3 sentences, encouraging but honest, referencing the trend), "tips": [string, string] (general, non-numeric lifestyle guidance)}. Data: ${JSON.stringify(payload)}`;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({model:'claude-sonnet-4-6', max_tokens:400, messages:[{role:'user', content:prompt}]})
    });
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('').trim().replace(/^```json/i,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(text); parsed.source='ai'; return parsed;
  }catch(e){ console.warn('weight insight AI failed, using offline rules', e); return ruleBasedWeightInsight(log, profile); }
}

/* ---------------------------------------------------------------------
   5d. MARATHON / TREADMILL PROGRAMME
   Progressive walk/jog interval sessions building toward continuous
   running, aligned to the same 6 phases as the strength programme.
   Honest framing: most marathon plans assume an existing base and run
   16-20 weeks; this builds general run/walk endurance across the full
   24 weeks and should be treated as base-building, not a guarantee of
   race-day readiness — a run coach should shape the final taper.
--------------------------------------------------------------------- */
function buildRunSession(week){
  const phase = phaseForWeek(week);
  const segs = [];
  const push = (type, speed, sec)=> segs.push({type, speed, sec});
  push('walk', 4, 300); // 5 min warm-up walk, every week

  // Progression is keyed to the absolute week (1-24), never resetting at a
  // phase boundary, so intensity climbs continuously and only comes back
  // down deliberately during the week 21-24 taper.
  if(week<=8){
    // Weeks 1-8: run/walk intervals. Jog segments lengthen and walk
    // recoveries shorten every single week; rep count also grows.
    const jogSec = Math.round(60 + (week-1)*(240/7));           // wk1: 60s  → wk8: 300s
    const walkSec = Math.max(45, Math.round(180 - (week-1)*(120/7))); // wk1: 180s → wk8: ~60s
    const jogSpeed = Math.round((6 + (week-1)*0.07)*10)/10;      // wk1: 6.0mph → wk8: 6.5mph
    const reps = 4 + Math.floor((week-1)/2);                     // wk1: 4 → wk8: 7
    for(let i=0;i<reps;i++){ push('jog', jogSpeed, jogSec); push('walk', 4.5, walkSec); }
  } else if(week<=16){
    // Weeks 9-16: intervals give way to continuous jogging blocks that
    // keep getting longer, with one short recovery walk in the middle.
    const contSec = Math.round(300 + (week-9)*(600/7));         // wk9: 5min → wk16: 15min
    push('jog', 6.4, contSec);
    push('walk', 4, 120);
    push('jog', 6.4, Math.round(contSec*0.6));
  } else if(week<=20){
    // Weeks 17-20: peak endurance — one long continuous run growing
    // toward the longest run of the whole plan.
    const longSec = Math.round(1200 + (week-17)*(1200/3));       // wk17: 20min → wk20: 40min
    push('jog', 6.6, 600);
    push('walk', 4, 120);
    push('run', 7.2, longSec);
  } else {
    // Weeks 21-24: taper — deliberately easing volume down (not a bug,
    // this is intentional) while keeping pace sharp before race week.
    const taperSec = Math.round(1200 - (week-21)*300);           // wk21: 20min → wk24: 5min
    push('jog', 6.8, Math.max(300, taperSec));
  }

  push('walk',3.5,240); // cool-down
  const estMinutes = Math.round(segs.reduce((a,s)=>a+s.sec,0)/60);
  const estKm = Math.round(segs.reduce((a,s)=>a + s.speed*(s.sec/3600),0)*10)/10;
  const longestContinuous = Math.max(...segs.filter(s=>s.type!=='walk').map(s=>s.sec/60), 0);
  return {week, phase:phase.n, segments:segs, estMinutes, estKm, longestContinuous};
}
const MARATHON_PLAN_VERSION = 2; // bump whenever buildRunSession's progression formula changes
async function buildMarathonPlan(){
  const weeks = []; for(let w=1; w<=24; w++) weeks.push(buildRunSession(w));
  return {weeks, targetDistanceKm:42.2, createdAt:Date.now(), planVersion:MARATHON_PLAN_VERSION, stats:{longestJogMin:0, totalKm:0, sessionsCompleted:0}};
}
async function saveMarathon(m){ App.state.marathon = m; await Store.set(k('marathon'), JSON.stringify(m)); }

/* Lets an existing profile turn on treadmill/marathon training later —
   no need to recreate the profile or touch the strength programme. */

  const p = App.state.profile;
  if(!p.equipment.includes('treadmill')) p.equipment = [...p.equipment, 'treadmill'];
  p.marathonPrep = true;

}

/* ---------------------------------------------------------------------
   5e. FACE ID (best-effort, on-device, confirm-before-use)
   Loads face-api.js + public model weights at runtime. If the network
   or browser doesn't cooperate, FaceID.ready stays false and every
   caller falls back to manual profile selection — nothing here ever
   switches a profile without an explicit tap from the person.
--------------------------------------------------------------------- */
const FaceID = {
  ready:false, loading:false,
  async init(){
    if(this.ready || this.loading) return;
    this.loading = true;
    const candidateUrls = [
      'https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights',
      'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights',
    ];
    try{
      await waitFor(()=>window.faceapi, 5000);
      let loaded = false;
      for(const url of candidateUrls){
        try{
          await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri(url),
            faceapi.nets.faceLandmark68TinyNet.loadFromUri(url),
            faceapi.nets.faceRecognitionNet.loadFromUri(url),
          ]);
          loaded = true; break;
        }catch(inner){ /* try next candidate URL */ }
      }
      this.ready = loaded;
      if(!loaded) console.info('Face check-in: model weights unreachable from this environment — using manual profile selection.');
    }catch(e){ console.info('Face check-in unavailable — using manual profile selection.'); this.ready = false; }
    this.loading = false;
    if(App.state.screen==='who') render();
  },
  async describe(videoEl){
    if(!this.ready || !videoEl || videoEl.readyState<2) return null;
    try{
      const det = await faceapi.detectSingleFace(videoEl, new faceapi.TinyFaceDetectorOptions())
        .withFaceLandmarks(true).withFaceDescriptor();
      return det ? Array.from(det.descriptor) : null;
    }catch(e){ return null; }
  },
  match(descriptor, profiles){
    if(!descriptor) return null;
    let best=null, bestDist=999;
    profiles.forEach(p=>{
      if(!p.faceDescriptor) return;
      let s=0; for(let i=0;i<descriptor.length;i++) s += (descriptor[i]-p.faceDescriptor[i])**2;
      const d = Math.sqrt(s);
      if(d<bestDist){ bestDist=d; best=p; }
    });
    return (best && bestDist<0.55) ? {profile:best, distance:bestDist} : null;
  }
};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function fmtSec(s){ s=Math.max(0,Math.round(s)); const m=Math.floor(s/60), r=s%60; return `${m}:${r.toString().padStart(2,'0')}`; }
function ring(pct, color, size, stroke, innerHtml){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-Math.max(0,Math.min(1,pct)));
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="${stroke}"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset .3s linear"/>
    </svg>
    <div class="ring-center">${innerHtml}</div>
  </div>`;
}
function avatarHtml(profile, size){
  const cls = size==='sm' ? 'avatar sm' : 'avatar';
  return `<div class="${cls}" style="background:${colorForId(profile.id)};">${initials(profile.name)}</div>`;
}

function skeletonSVG(pose, color, id){
  const W=6;
  const mk=(p,dx)=>[p[0]+dx,p[1]];
  const L = kk=>mk(pose[kk], -W), R = kk=>mk(pose[kk], W);
  const bones = [
    [L('shoulder'),R('shoulder')], [L('hip'),R('hip')],
    [L('shoulder'),L('hip')], [R('shoulder'),R('hip')],
    [L('shoulder'),L('elbow')],[L('elbow'),L('wrist')],
    [R('shoulder'),R('elbow')],[R('elbow'),R('wrist')],
    [L('hip'),L('knee')],[L('knee'),L('ankle')],
    [R('hip'),R('knee')],[R('knee'),R('ankle')],
  ];
  const joints = ['shoulder','hip','elbow','wrist','knee','ankle'].flatMap(kk=>[L(kk),R(kk)]);
  const lines = bones.map(([a,b])=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${color}" stroke-width="2.6" stroke-linecap="round"/>`).join('');
  const dots = joints.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.1" fill="${color}"/>`).join('');
  const head = `<circle cx="${pose.head[0]}" cy="${pose.head[1]}" r="7" fill="none" stroke="${color}" stroke-width="2.6"/>`;
  return `<svg id="${id}" viewBox="0 0 100 140" style="overflow:visible">${lines}${dots}${head}</svg>`;
}

/* ---------------------------------------------------------------------
   11. RENDER DISPATCH
--------------------------------------------------------------------- */
function render(){
  const root = document.getElementById('root');
  const s = App.state;
  let html = '';
  switch(s.screen){
    case 'loading': html = `<div style="min-height:100vh;"></div>`; break;
    case 'welcome': html = screenWelcome(); break;
    case 'who': html = screenWho(); break;
    case 'equipment': html = screenEquipment(); break;
    case 'baseline': html = screenBaseline(); break;
    case 'enroll-face': html = screenEnrollFace(); break;
    case 'building': html = screenBuilding(); break;
    case 'dashboard':
      html = ({today:screenDashboardToday, programme:screenProgramme, history:screenHistory, coach:screenCoach, progress:screenProgress})[s.tab]();
      break;
    case 'log-weight': html = screenLogWeight(); break;
    case 'exercise-intro': html = screenExerciseIntro(); break;
    case 'position': html = screenPosition(); break;
    case 'countdown': html = screenCountdown(); break;
    case 'live': html = screenLive(); break;
    case 'set-complete': html = screenSetComplete(); break;
    case 'rest': html = screenRest(); break;
    case 'workout-complete': html = screenWorkoutComplete(); break;
    case 'feedback': html = screenFeedback(); break;
    case 'generating': html = screenGenerating(); break;
    case 'ai-report': html = screenAIReport(); break;
    case 'run-intro': html = screenRunIntro(); break;
    case 'run-live': html = screenRunLive(); break;
    case 'run-complete': html = screenRunComplete(); break;
    default: html = `<div class="pad">Unknown screen</div>`;
  }
  if(s.toast) html = `<div class="toast">${s.toast}</div>` + html;
  root.innerHTML = html;
  wire();
  postRenderHooks();
}

async function commitNewProfile(){
  const d = App.state.onboardingDraft;
  const name = d.name || `Person ${App.state.profiles.length+1}`;
  const weight = parseFloat(d.weight);
  const goal = parseFloat(d.goal);
  const id = 'p'+Date.now()+Math.floor(Math.random()*1000);
  const profile = {
    id, name, level: d.level||'2',
    equipment: d.equipment||[],
    startWeight: isNaN(weight)?null:weight,
    goalWeight: isNaN(goal)?null:goal,
    marathonPrep: !!d.marathon && (d.equipment||[]).includes('treadmill'),
    faceDescriptor: App._pendingFaceDescriptor || null,
    createdAt: Date.now(),
  };
  App._level=null; App._marathon=false; App._pendingFaceDescriptor=null;
  App.state.profiles.push(profile);
  await saveProfiles(App.state.profiles);
  await loadProfileData(id); // sets activeProfileId + resets programme/history/weight to empty
  App.set({screen:'building'});
  const programme = await buildProgramme(profile.equipment);
  App.state.programme = programme;
  await Store.set(k('programme'), JSON.stringify(programme));
  await Store.set(k('equipment'), JSON.stringify(profile.equipment));
  if(profile.startWeight!=null){
    App.state.weightLog = [];
    await logWeight(profile.startWeight);
  }
  if(profile.marathonPrep){
    const marathon = await buildMarathonPlan();
    await saveMarathon(marathon);
  }
  App.state.onboardingDraft = {};
  App.set({screen:'dashboard', tab:'today', weekIdx:1});
}

let liveEngine=null, liveTimer=null, liveStream=null, restInterval=null, countdownTimer=null;

function stopLiveTimer(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

const CAMERA_SCREENS = new Set(['position','countdown','live','set-complete','rest','exercise-intro','workout-complete']);

async function postRenderHooks(){
  const s = App.state;

async function setupCamera(){

function runCountdown(){

  countdownTimer = setInterval(()=>{
    n--;
    if(n<=0){ clearInterval(countdownTimer); App.set({screen:'live'}); return; }

function runLiveExercise(){
  const w = App.state.workout; const plan = w.plan[w.idx]; const ex = EXERCISES[plan.exId];
  const video = document.getElementById('camVideo'); const canvas = document.getElementById('motionCanvas');
  const provider = App.state.demoMode ? new DemoPoseProvider(ex) : new MotionPoseProvider(video, canvas);

  const mainEl = ()=>document.getElementById('liveMain');
  const cueEl = ()=>document.getElementById('cueText');
  const formPctEl = ()=>document.getElementById('formPct');
  const formFillEl = ()=>document.getElementById('formFill');
  const confChip = ()=>document.getElementById('confChip');

  if(ex.rep.type==='hold'){
    const target = plan.holdSec;
    liveEngine = new HoldEngine(ex, target, {
      onTick:(elapsed,stable,conf)=>{
        if(mainEl()) mainEl().innerHTML = `${fmtSec(elapsed)} <span style="font-size:24px;color:var(--ink-dim);">/ ${fmtSec(target)}</span>`;
        if(confChip()) confChip().textContent = 'CONF ' + Math.round(conf*100)+'%';
        if(conf>0.25){ if(cueEl()) cueEl().textContent = stable? 'Holding steady — good.' : 'Re-brace: keep the line straight.'; if(formFillEl()){ formFillEl().style.width = (stable?92:70)+'%'; formFillEl().style.background = stable? 'var(--recovery)':'var(--effort)'; } if(formPctEl()) formPctEl().textContent=(stable?92:70)+'%'; }
        else { if(cueEl()) cueEl().textContent='Analyzing…'; }
        if(elapsed>=target){ finishCurrentSet(false); }
      }
    });
  } else {
    liveEngine = new RepEngine(ex, {
      onRep:(count,quality,conf)=>{
        if(mainEl()) mainEl().textContent = count;
        if(navigator.vibrate) try{navigator.vibrate(15);}catch(e){}
        if(count>=plan.reps){ finishCurrentSet(false); }
      },
      onPartial:()=>{ if(cueEl()) cueEl().textContent = 'Partial rep — go slightly deeper.'; },
      onSignal:(signal,conf,formScore)=>{
        if(confChip()) confChip().textContent = 'CONF ' + Math.round(conf*100)+'%';
        if(conf>0.25){
          if(formFillEl()){ formFillEl().style.width = formScore+'%'; formFillEl().style.background = formScore>85?'var(--recovery)':(formScore>70?'var(--effort)':'var(--alert)'); }
          if(formPctEl()) formPctEl().textContent = formScore+'%';
          if(cueEl() && cueEl().textContent==='Analyzing…') cueEl().textContent = ex.cues[Math.floor(Math.random()*ex.cues.length)];
        } else {
          if(cueEl()) cueEl().textContent = 'Analyzing…';
          if(formPctEl()) formPctEl().textContent = '—';
        }
      }
    });
  }

  liveTimer = setInterval(()=>{
    if(App.state.screen!=='live') return;
    liveEngine.feed(provider.sample());
  }, 100);
}

function finishCurrentSet(manual){
  clearInterval(liveTimer); liveTimer=null;
  const w = App.state.workout; const plan = w.plan[w.idx]; const ex=EXERCISES[plan.exId];
  let setResult;
  if(ex.rep.type==='hold'){
    setResult = {reps:null, target:null, holdSec: liveEngine? liveEngine.elapsed : 0, formPct: 85};
  } else {
    const reps = liveEngine? liveEngine.reps : 0;
    setResult = {reps, target: plan.reps, formPct: liveEngine? liveEngine.formScore : 80};
  }
  w.lastSet = setResult;
  w.sessionLogs.push({exId:plan.exId, setNum:w.setNum, ...setResult});
  App.set({screen:'set-complete'});
}

function continueAfterSet(){
  const w = App.state.workout; const plan = w.plan[w.idx];
  if(w.setNum < plan.sets){
    w.setNum++;
    w.restNextIsNewExercise = false;
    w.restRemaining = plan.restSec;
    App.set({screen:'rest'});
  } else {
    advanceToNextExercise();
  }
}

function advanceToNextExercise(){
  const w = App.state.workout;
  if(w.idx < w.plan.length-1){
    w.idx++; w.setNum=1;
    w.restNextIsNewExercise = true;
    w.restRemaining = 30;
    App.set({screen: (App.state.screen==='exercise-intro')? 'exercise-intro' : 'rest'});
    if(App.state.screen!=='exercise-intro'){} // rest first, then intro after rest completes
  } else {
    finishWorkout();
  }
}

function runRest(){
  clearInterval(restInterval);
  const w = App.state.workout;
  const tick = ()=>{
    w.restRemaining -= 1;
    const numEl = document.getElementById('restNum');
    if(numEl) numEl.textContent = fmtSec(w.restRemaining);
    if(w.restRemaining<=0){ endRestNow(); }
  };
  restInterval = setInterval(tick, 1000);
}
function endRestNow(){
  clearInterval(restInterval);
  const w = App.state.workout;
  if(w.restNextIsNewExercise){ App.set({screen:'exercise-intro'}); }
  else { App.set({screen:'live'}); }
}

function finishWorkout(){
  const w = App.state.workout;
  const byExercise = {};
  w.sessionLogs.forEach(l=>{
    byExercise[l.exId] = byExercise[l.exId] || {exId:l.exId, sets:[], plannedReps:0, completedReps:0};
    byExercise[l.exId].sets.push(l);
    const target = l.target || 1;
    byExercise[l.exId].plannedReps += (l.target||0);
    byExercise[l.exId].completedReps += (l.reps!=null? Math.min(l.reps,target) : target);
  });
  const exercises = Object.values(byExercise).map(e=>{
    const avgForm = Math.round(e.sets.reduce((a,s)=>a+s.formPct,0)/e.sets.length);
    const completionPct = e.plannedReps? Math.round(e.completedReps/e.plannedReps*100) : 100;
    return {exId:e.exId, avgForm, completionPct, sets:e.sets, avgRpe: w.plan.find(p=>p.exId===e.exId)?.rpe, targetRpe: w.plan.find(p=>p.exId===e.exId)?.rpe};
  });
  const plannedReps = exercises.reduce((a,e)=>a + w.sessionLogs.filter(l=>l.exId===e.exId).reduce((x,l)=>x+(l.target||1),0),0);
  const completedReps = exercises.reduce((a,e)=>a + w.sessionLogs.filter(l=>l.exId===e.exId).reduce((x,l)=>x + (l.reps!=null?Math.min(l.reps,l.target||1):(l.target||1)),0),0);
  const avgForm = Math.round(exercises.reduce((a,e)=>a+e.avgForm,0)/Math.max(1,exercises.length));
  w.avgFormSoFar = avgForm;
  w.performance = {week:w.week, dayKey:w.dayKey, plannedReps, completedReps, avgForm, exercises, painReported:null};
  App.set({screen:'workout-complete'});
}

async function submitFeedback(){
  const w = App.state.workout;
  w.performance.painReported = !!w.feedback.pain;
  w.performance.avgRpe = w.feedback.difficulty;

  if(!report.insight && notes.length) report.insight = notes.slice(0,2).join(' ');

    completedReps: w.performance.completedReps, summary: report.summary, insight: report.insight,

  };
  await App.pushHistory(entry);
  App.set({screen:'ai-report'});

/* ---------------------------------------------------------------------
   17. RUN / TREADMILL ENGINE
--------------------------------------------------------------------- */
let runInterval=null, audioCtx=null;
function beep(freq, ms){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type='sine'; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    o.start(); o.stop(audioCtx.currentTime + ms/1000);
  }catch(e){ /* audio unavailable, ignore */ }
}
function startRun(){
  const plan = App.state.marathon.weeks[App.state.weekIdx-1];
  App.state.runSession = {plan, idx:0, remaining:plan.segments[0].sec, startedAt:null, elapsedActive:0, longestContinuousSec:0, currentContinuousSec:0};
  App.set({screen:'run-intro'});
}
function runStartSegments(){
  const r = App.state.runSession;
  r.startedAt = Date.now();
  App.set({screen:'run-live'});
  clearInterval(runInterval);
  beep(880,150);
  runInterval = setInterval(runTick, 1000);
}
function runTick(){
  const r = App.state.runSession; if(!r) return;
  const seg = r.plan.segments[r.idx];
  r.remaining -= 1; r.elapsedActive += 1;
  if(seg.type!=='walk'){ r.currentContinuousSec += 1; r.longestContinuousSec = Math.max(r.longestContinuousSec, r.currentContinuousSec); }
  else { r.currentContinuousSec = 0; }
  if(r.remaining<=3 && r.remaining>0){ beep(660,90); }
  if(r.remaining<=0){
    r.idx += 1;
    if(r.idx >= r.plan.segments.length){ finishRun(false); return; }
    r.remaining = r.plan.segments[r.idx].sec;
    beep(880,150);
  }
  const numEl = document.querySelector('.ring-center .disp:nth-child(2)');
  if(App.state.screen==='run-live') render();
}
function finishRun(early){
  clearInterval(runInterval); runInterval=null;
  const r = App.state.runSession;
  const actualMinutes = r.elapsedActive/60;
  const actualKm = Math.round(r.plan.segments.reduce((a,s,i)=>{
    const secDone = i<r.idx ? s.sec : (i===r.idx ? Math.max(0,s.sec-r.remaining) : 0);
    return a + s.speed*(secDone/3600);
  },0)*10)/10;
  const longestContinuousMin = Math.round(r.longestContinuousSec/60*10)/10;
  r.actualMinutes = actualMinutes; r.actualKm = actualKm; r.longestContinuousMin = longestContinuousMin;
  r.note = early ? 'Session ended early — logged what you completed.' : 'Full session complete.';

  const marathon = App.state.marathon;
  marathon.stats.longestJogMin = Math.max(marathon.stats.longestJogMin, longestContinuousMin);
  marathon.stats.totalKm = Math.round((marathon.stats.totalKm + actualKm)*10)/10;
  marathon.stats.sessionsCompleted += 1;
  saveMarathon(marathon);

  App.pushHistory({
    type:'run', week:App.state.weekIdx, completedAt:Date.now(),
    minutes:Math.round(actualMinutes), estKm:actualKm, longestContinuousMin,
  });
  App.set({screen:'run-complete'});
}

let progChartInstance=null, weightChartInstance=null;
function drawProgressChart(){
  const canvas = document.getElementById('progChart'); if(!canvas || !window.Chart) return;
  if(progChartInstance) progChartInstance.destroy();
  const h = App.state.history.filter(x=>x.type!=='run');
  progChartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels:h.map((x,i)=>'S'+(i+1)),
      datasets:[
        {label:'Score', data:h.map(x=>x.score), borderColor:'#FF6A39', backgroundColor:'rgba(255,106,57,.15)', tension:.35, fill:true},
        {label:'Form %', data:h.map(x=>x.avgForm), borderColor:'#38D6C9', backgroundColor:'rgba(56,214,201,.1)', tension:.35, fill:true},
      ]},
    options:{ plugins:{legend:{labels:{color:'#8D96A1', font:{family:'Inter'}}}},
      scales:{ x:{ticks:{color:'#565F69'}, grid:{color:'rgba(255,255,255,.05)'}}, y:{ticks:{color:'#565F69'}, grid:{color:'rgba(255,255,255,.05)'}} } }
  });
}
function drawWeightChart(){
  const canvas = document.getElementById('weightChart'); if(!canvas || !window.Chart) return;
  if(weightChartInstance) weightChartInstance.destroy();
  const wl = App.state.weightLog;
  const goal = App.state.profile.goalWeight;
  const datasets = [{label:'Weight (kg)', data:wl.map(x=>x.kg), borderColor:'#38D6C9', backgroundColor:'rgba(56,214,201,.12)', tension:.3, fill:true}];
  if(goal!=null){ datasets.push({label:'Goal', data:wl.map(()=>goal), borderColor:'#E8B84B', borderDash:[6,4], pointRadius:0}); }
  weightChartInstance = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels:wl.map(x=>'Day '+x.day), datasets },
    options:{ plugins:{legend:{labels:{color:'#8D96A1', font:{family:'Inter'}}}},
      scales:{ x:{ticks:{color:'#565F69'}, grid:{color:'rgba(255,255,255,.05)'}}, y:{ticks:{color:'#565F69'}, grid:{color:'rgba(255,255,255,.05)'}} } }
  });
}
